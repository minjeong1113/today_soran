<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07152d" />
  <meta name="description" content="다섯 가지 질문으로 오늘의 나에게 어울리는 소란의 노래를 추천받아 보세요." />
  <title>오늘의 소란</title>
  <style>
    :root {
      --night: #061329;
      --navy: #0b2145;
      --navy-2: #123766;
      --sky: #7dcfff;
      --sky-soft: #c9edff;
      --white: #f7fbff;
      --muted: #a9bfd8;
      --line: rgba(172, 220, 255, .18);
      --glass: rgba(16, 45, 83, .64);
      --shadow: 0 24px 80px rgba(0, 10, 31, .42);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--night); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--white);
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 12%, rgba(78, 177, 255, .28), transparent 28rem),
        radial-gradient(circle at 88% 78%, rgba(44, 115, 202, .22), transparent 32rem),
        linear-gradient(145deg, #041023 0%, #0b2145 54%, #061329 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .32;
      background-image: radial-gradient(rgba(255,255,255,.72) .65px, transparent .65px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, black, transparent 74%);
    }

    button, a { font: inherit; }
    button { color: inherit; }

    .shell {
      width: min(100%, 460px);
      min-height: 100svh;
      margin: 0 auto;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: max(22px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }

    .topbar {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    .brand {
      color: var(--sky-soft);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .18em;
    }

    .sound-mark {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 17px;
      padding: 0 3px;
    }
    .sound-mark i { width: 3px; border-radius: 4px; background: var(--sky); animation: wave 1.4s ease-in-out infinite; }
    .sound-mark i:nth-child(1) { height: 7px; }
    .sound-mark i:nth-child(2) { height: 15px; animation-delay: -.3s; }
    .sound-mark i:nth-child(3) { height: 10px; animation-delay: -.6s; }
    .sound-mark i:nth-child(4) { height: 5px; animation-delay: -.9s; }
    @keyframes wave { 50% { transform: scaleY(.48); opacity: .58; } }

    main { flex: 1; display: flex; }
    .view { width: 100%; display: none; animation: rise .38s ease both; }
    .view.active { display: flex; flex-direction: column; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .intro { justify-content: space-between; padding: 1.5vh 0 12px; }
    .sky-orbit {
      width: min(76vw, 328px);
      aspect-ratio: 1;
      margin: 0 auto 20px;
      position: relative;
      display: grid;
      place-items: center;
    }
    .sky-orbit::before {
      content: "";
      width: 70%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 34%, #ecfaff 0%, #8ed7ff 30%, #3189cf 72%, #123866 100%);
      box-shadow: 0 0 62px rgba(87, 190, 255, .42), inset -18px -18px 42px rgba(2, 23, 57, .22);
    }
    .sky-orbit::after {
      content: "";
      position: absolute;
      inset: 9%;
      border: 1px solid rgba(178, 226, 255, .38);
      border-radius: 50%;
      transform: rotate(-17deg) scaleY(.46);
    }
    .orbit-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 18px var(--sky);
      position: absolute;
      top: 48%;
      right: 6%;
    }

    .eyebrow { color: var(--sky); font-size: .78rem; font-weight: 800; letter-spacing: .14em; margin: 0 0 12px; }
    h1, h2, p { margin-top: 0; }
    h1 { font-size: clamp(1.5rem, 7vw, 2.65rem); line-height: 1.08; letter-spacing: -.045em; margin-bottom: 18px; }
    .intro h1 { line-height: 1.18; white-space: nowrap; }
    h1 span { color: var(--sky-soft); }
    .intro-copy { max-width: 340px; color: var(--muted); font-size: 1rem; line-height: 1.7; margin-bottom: 28px; }

    .primary {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 18px;
      color: #06172d;
      background: linear-gradient(135deg, #d9f4ff, #72caff);
      font-size: 1rem;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 13px 30px rgba(62, 166, 235, .24);
      transition: transform .18s ease, filter .18s ease;
    }
    .primary:hover { filter: brightness(1.04); transform: translateY(-1px); }
    .primary:active { transform: translateY(1px) scale(.99); }

    .quiz { padding: 26px 0 8px; }
    .quiz-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .back-button {
      padding: 5px 0;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: .82rem;
      cursor: pointer;
    }
    .back-button:focus-visible { color: var(--white); outline: 2px solid var(--sky); outline-offset: 4px; border-radius: 4px; }
    .progress-label { flex: 1; display: flex; justify-content: space-between; color: var(--muted); font-size: .82rem; }
    .progress-track { height: 5px; border-radius: 20px; background: rgba(255,255,255,.1); overflow: hidden; margin-bottom: 46px; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #62bdf5, #c7efff); transition: width .35s ease; }
    .question-kicker { color: var(--sky); font-size: .82rem; font-weight: 750; margin-bottom: 11px; }
    .question-title { font-size: clamp(1.75rem, 7vw, 2.25rem); line-height: 1.25; letter-spacing: -.035em; margin-bottom: 30px; white-space: pre-line; }
    .answers { display: grid; gap: 11px; }
    .answer {
      min-height: 66px;
      width: 100%;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(30, 72, 119, .68), rgba(9, 31, 65, .74));
      box-shadow: inset 0 1px rgba(255,255,255,.04);
      cursor: pointer;
      transition: border-color .2s ease, transform .2s ease, background .2s ease;
    }
    .answer:focus-visible { border-color: rgba(139, 211, 255, .72); background: rgba(33, 79, 129, .82); transform: translateX(3px); outline: none; }
    .answer:active { transform: scale(.99); }
    @media (hover: hover) and (pointer: fine) {
      .answer:hover { border-color: rgba(139, 211, 255, .72); background: rgba(33, 79, 129, .82); transform: translateX(3px); }
    }
    .answer span { font-size: 1rem; font-weight: 650; line-height: 1.45; }
    .answer b { color: var(--sky); font-size: 1.25rem; font-weight: 400; }

    .result { padding: 22px 0 8px; }
    .result-heading { text-align: center; margin-bottom: 26px; }
    .result-heading .eyebrow { margin-bottom: 8px; }
    .result-heading h2 { font-size: 1.65rem; letter-spacing: -.04em; margin-bottom: 0; }

    .album-wrap {
      width: min(38vw, 160px);
      margin: 0 auto 27px;
      position: relative;
    }
    .album-wrap::before {
      content: "";
      position: absolute;
      inset: 8% -8% -9% 11%;
      border-radius: 24px;
      background: var(--accent, #63bff4);
      opacity: .22;
      filter: blur(27px);
    }
    .album-art {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      object-fit: cover;
      position: relative;
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: var(--shadow);
      background: var(--navy-2);
    }

    .song-meta { text-align: center; margin-bottom: 23px; }
    .album-name { color: var(--sky); font-size: .8rem; font-weight: 750; text-transform: uppercase; letter-spacing: .12em; margin-bottom: 8px; }
    .song-title { font-size: 2rem; line-height: 1.2; letter-spacing: -.045em; margin-bottom: 11px; }
    .reason { color: var(--sky-soft); font-size: 1rem; font-weight: 650; line-height: 1.55; margin-bottom: 0; }

    .story {
      padding: 19px 20px;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 19px;
      color: #d6e7f6;
      background: var(--glass);
      font-size: .94rem;
      line-height: 1.68;
    }
    .video-label { color: var(--sky); font-size: .8rem; font-weight: 750; letter-spacing: .08em; margin: 7px 0 10px; }
    .video-card {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-bottom: 31px;
      overflow: hidden;
      border: 1px solid rgba(179, 223, 255, .24);
      border-radius: 20px;
      background: #020915;
      box-shadow: 0 18px 45px rgba(0, 7, 24, .32);
    }
    .video-card iframe { width: 100%; height: 100%; display: block; border: 0; }

    .more-title { font-size: .92rem; color: var(--muted); margin-bottom: 12px; }
    .more-list { display: grid; gap: 10px; margin-bottom: 22px; }
    .more-card {
      display: grid;
      grid-template-columns: 54px 1fr auto;
      align-items: center;
      gap: 13px;
      padding: 9px 12px 9px 9px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
      background: rgba(8, 29, 61, .55);
    }
    .more-card img { width: 54px; height: 54px; object-fit: cover; border-radius: 11px; }
    .more-card strong { display: block; font-size: .94rem; margin-bottom: 4px; }
    .more-card small { color: var(--muted); font-size: .76rem; }
    .more-card b { color: var(--sky); font-size: 1.1rem; font-weight: 400; }
    .ghost { width: 100%; padding: 14px; border: 0; color: var(--muted); background: transparent; cursor: pointer; }

    .footer-note { margin: 18px 0 0; text-align: center; color: rgba(194, 216, 237, .58); font-size: .73rem; }
    .fan-note { margin: 8px auto 0; max-width: 390px; text-align: center; color: rgba(194, 216, 237, .46); font-size: .68rem; line-height: 1.5; }

    @media (min-width: 700px) {
      .shell {
        min-height: calc(100vh - 48px);
        margin: 24px auto;
        padding: 28px 30px;
        border: 1px solid rgba(179, 223, 255, .13);
        border-radius: 32px;
        background: rgba(4, 19, 44, .58);
        box-shadow: 0 30px 100px rgba(0,0,0,.3);
        overflow: hidden;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">TODAY'S SORAN</div>
      <div class="sound-mark" aria-label="재생 중"><i></i><i></i><i></i><i></i></div>
    </header>

    <main>
      <section class="view intro active" id="intro">
        <div>
          <div class="sky-orbit" aria-hidden="true"><i class="orbit-dot"></i></div>
          <p class="eyebrow">오늘을 위한 한 곡</p>
          <h1>오늘의 당신에게는,<br><span>어떤 소란이 필요할까요?</span></h1>
          <p class="intro-copy">다섯 번의 선택으로 지금의 마음과 가장 가까운<br>소란의 노래를 찾아드려요.</p>
        </div>
        <div>
          <button class="primary" id="startButton" type="button">노래 찾으러 가기</button>
          <p class="footer-note">약 1분 · 곡 목록 자동 업데이트 · 답변은 저장되지 않아요</p>
          <p class="fan-note">본 사이트는 밴드 소란을 좋아하는 팬이 만든 비공식·비영리 팬 프로젝트입니다.<br>소란 및 앨범·음원·영상 관련 권리는 각 권리자에게 있습니다.</p>
        </div>
      </section>

      <section class="view quiz" id="quiz" aria-live="polite">
        <div class="quiz-nav">
          <button class="back-button" id="backButton" type="button" aria-label="이전 화면으로 돌아가기">← 이전</button>
          <div class="progress-label"><span id="stepText">QUESTION 1</span><span id="countText">1 / 5</span></div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <p class="question-kicker" id="questionKicker"></p>
        <h2 class="question-title" id="questionTitle"></h2>
        <div class="answers" id="answers"></div>
      </section>

      <section class="view result" id="result">
        <div class="result-heading">
          <p class="eyebrow">TODAY'S SONG</p>
          <h2>오늘의 당신에게는</h2>
        </div>
        <div class="album-wrap" id="albumWrap">
          <img class="album-art" id="albumArt" alt="" decoding="async" fetchpriority="high" />
        </div>
        <div class="song-meta">
          <p class="album-name" id="albumName"></p>
          <h1 class="song-title" id="songTitle"></h1>
          <p class="reason" id="reason"></p>
        </div>
        <p class="story" id="story"></p>
        <p class="video-label">OFFICIAL YOUTUBE</p>
        <div class="video-card">
          <iframe id="youtubePlayer" title="추천곡 공식 유튜브 영상" src="" loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <p class="more-title">이 마음에 이어 듣기 좋은 곡</p>
        <div class="more-list" id="moreList"></div>
        <button class="ghost" id="retryButton" type="button">처음부터 다시 하기</button>
      </section>
    </main>
  </div>

  <script src="data/songs.js"></script>
  <script>
    const questions = [
      {
        kicker: '지금의 마음',
        title: '오늘 하루의 기분은\n어떤 하늘에 가까웠나요?',
        options: [
          { label: '구름 한 점 없이 파란 하늘', emotion: ['행복', '설렘'], direction: 2 },
          { label: '조금은 흐린 차가운 하늘', emotion: ['위로', '평온', '아련함'], direction: 0 },
          { label: '달빛 없이 까맣게 내린 어둠', emotion: ['슬픔', '외로움', '쓸쓸함'], direction: -2 },
          { label: '소나기 내린 뒤, 맑아지는 중', emotion: ['희망', '벅참'], direction: 1 }
        ]
      },
      {
        kicker: '마음이 향하는 곳',
        title: '지금 가장 먼저\n떠오르는 사람은요?',
        options: [
          { label: '요즘 조금 신경 쓰이는 사람', relation: ['짝사랑', '새로운 사랑', '동행', '팬·동료'], branch: 'interest' },
          { label: '오래 함께하고 싶은 사람', relation: ['연인', '오랜 관계', '동행', '가족', '팬·동료'], branch: 'long' },
          { label: '문득 생각난 지나간 사람', relation: ['이별'], branch: 'past' },
          { label: '오늘만큼은 나 자신', relation: ['나', '관계없음'], branch: 'self' }
        ]
      },
      null,
      {
        kicker: '노래의 역할',
        title: '이 노래가 당신에게 무엇을 해주면 좋을까요?',
        options: [
          { label: '내 마음을 알아줬으면 해요', role: ['공감'] },
          { label: '조용히 다독여줬으면 해요', role: ['안정'] },
          { label: '기분을 시원하게 바꿔줬으면 해요', role: ['전환'], exclusionContext: ['기분 전환'] },
          { label: '이 기분을 유지하고 싶어요', role: ['유지'] }
        ]
      },
      {
        kicker: '마지막 취향',
        title: '지금 귀에 닿았으면 하는 소리는?',
        options: [
          { label: '숨을 고르게 하는 잔잔한 어쿠스틱', sound: ['어쿠스틱', '발라드'], energy: 1 },
          { label: '몸이 살짝 움직이는 산뜻한 팝', sound: ['팝', '그루브'], energy: 3 },
          { label: '가슴이 탁 트이는 힘찬 밴드 사운드', sound: ['록', '밴드'], energy: 5 },
          { label: '상관없어요, 지금 마음에만 맞으면 돼요', sound: [], energy: 3 }
        ]
      }
    ];

    const branchQuestions = {
      interest: {
        kicker: '요즘 조금 신경 쓰이는 사람',
        title: '그 사람과 지금\n어떤 사이에 가까운가요?',
        options: [
          { label: '아직은 서로를 잘 모르는 사이예요', situation: ['관심', '구애', '바라봄'] },
          { label: '조금씩 서로를 알아가고 있어요', situation: ['관심', '연애 시작', '일상'] },
          { label: '먼저 다가가 더 가까워지고 싶어요', situation: ['다가감', '구애', '고백 직전', '연애 시작'], exclusionContext: ['고백 용기'] },
          { label: '어느새 함께하는 시간이 기다려져요', situation: ['데이트', '일상', '동행', '생각남', '사랑에 빠짐', '푹 빠짐'] }
        ]
      },
      long: {
        kicker: '오래 함께하고 싶은 사람',
        title: '그 사람과 어떤 시간을\n함께하고 싶나요?',
        options: [
          { label: '별일 없는 평범한 하루', situation: ['일상', '애정 표현'] },
          { label: '어디론가 떠나는 여행', situation: ['여행', '동행'] },
          { label: '힘든 날 서로를 다독이는 시간', situation: ['위로', '지침', '회복', '자기존중', '사랑의 힘'] },
          { label: '오래오래 함께하자는 약속', situation: ['약속', '청혼', '함께함', '운명', '만남', '감사'] }
        ]
      },
      past: {
        kicker: '문득 생각난 지나간 사람',
        title: '그 사람을 떠올리면\n어떤 마음이 남나요?',
        options: [
          { label: '다시 돌아오기를 기다리고 있어요', situation: ['기다림', '재회'] },
          { label: '좋았던 순간이 그리워요', situation: ['추억', '회상'] },
          { label: '그때 왜 그랬을까 후회돼요', situation: ['후회', '되돌림'] },
          { label: '이제는 천천히 놓아주고 싶어요', situation: ['이별 정리', '이별 후'], exclusionContext: ['이별 정리'] }
        ]
      },
      self: {
        kicker: '오늘만큼은 나 자신',
        title: '지금의 나에게는\n어떤 시간이 필요할까요?',
        options: [
          { label: '아무것도 하지 않고 쉬는 시간', situation: ['휴식', '밤', '하루 마무리'], exclusionContext: ['깊은 휴식'] },
          { label: '내 마음을 알아주는 다정한 위로', situation: ['위로', '지침', '자기 위로'] },
          { label: '다시 시작할 수 있는 용기', situation: ['시작', '도전', '성장', '응원'] },
          { label: '맛있는 것도 먹고 신나게 기분 전환', situation: ['공연', '여행', '감정 폭발', '전환점', '맛있는 음식', '식욕', '기분 전환'], exclusionContext: ['기분 전환'] }
        ]
      }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let quoted = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        if (quoted) {
          if (char === '"' && text[i + 1] === '"') {
            cell += '"';
            i += 1;
          } else if (char === '"') {
            quoted = false;
          } else {
            cell += char;
          }
        } else if (char === '"') {
          quoted = true;
        } else if (char === ',') {
          row.push(cell);
          cell = '';
        } else if (char === '\n') {
          row.push(cell.replace(/\r$/, ''));
          rows.push(row);
          row = [];
          cell = '';
        } else {
          cell += char;
        }
      }

      if (cell || row.length) {
        row.push(cell.replace(/\r$/, ''));
        rows.push(row);
      }
      return rows;
    }

    function splitTags(value = '') {
      return value.split(',').map(tag => tag.trim()).filter(Boolean);
    }

    function extractYouTubeId(url = '') {
      try {
        const parsed = new URL(url);
        if (parsed.hostname.includes('youtu.be')) return parsed.pathname.split('/').filter(Boolean)[0] || '';
        if (parsed.searchParams.get('v')) return parsed.searchParams.get('v');
        const parts = parsed.pathname.split('/').filter(Boolean);
        const marker = parts.findIndex(part => ['embed', 'shorts', 'live'].includes(part));
        return marker >= 0 ? (parts[marker + 1] || '') : '';
      } catch {
        return '';
      }
    }

    function optimizeImageUrl(url = '') {
      const clean = url.trim();
      if (!clean.startsWith('https://res.cloudinary.com/') || !clean.includes('/upload/')) return '';
      if (/\/upload\/(?:[^/]*,)?f_auto/.test(clean)) return clean;
      return clean.replace('/upload/', '/upload/f_auto,q_auto,w_640,h_640,c_fill/');
    }

    function sheetRowsToSongs(csv) {
      const rows = parseCsv(csv);
      if (rows.length < 2) return [];
      const headers = rows[0].map((header, index) => index === 0 ? header.replace(/^\uFEFF/, '').trim() : header.trim());
      const column = name => headers.indexOf(name);
      const value = (row, name) => {
        const index = column(name);
        return index >= 0 ? String(row[index] || '').trim() : '';
      };

      return rows.slice(1).map((row, index) => {
        const title = value(row, '노래 제목');
        if (!title) return null;
        const youtube = value(row, '유튜브 링크');
        const videoId = extractYouTubeId(youtube);
        const bundled = bundledByTitle.get(title);
        const sheetImage = optimizeImageUrl(value(row, '앨범 이미지 주소'));
        return {
          id: `sheet-song-${String(index + 1).padStart(3, '0')}`,
          title,
          description: value(row, '곡 소개'),
          youtube,
          videoId,
          album: value(row, '앨범명'),
          year: Number(value(row, '발매연도')) || null,
          image: sheetImage || bundled?.image || (videoId ? `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg` : ''),
          emotion: splitTags(value(row, '감정 태그')),
          relation: splitTags(value(row, '관계 태그')),
          situation: splitTags(value(row, '상황 태그')),
          role: splitTags(value(row, '역할 태그')),

          direction: Number(value(row, '감정 방향')) || 0,
          exclude: splitTags(value(row, '제외 조건'))
        };
      }).filter(song => song && song.youtube && song.videoId);

    function readCachedSongs() {

    async function syncSongs() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      try {
        const separator = SHEET_CSV_URL.includes('?') ? '&' : '?';
        const response = await fetch(`${SHEET_CSV_URL}${separator}updated=${Date.now()}`, {
          cache: 'no-store',
          signal: controller.signal
        });
        if (!response.ok) throw new Error(`Sheet request failed: ${response.status}`);
        const liveSongs = sheetRowsToSongs(await response.text());
        if (!liveSongs.length) throw new Error('No valid songs in sheet');
        songs = liveSongs;
        localStorage.setItem(SONG_CACHE_KEY, JSON.stringify(liveSongs));
        console.info(`[song data] synced ${liveSongs.length} songs`);
      } catch (error) {
        console.warn('[song data] using cached or bundled songs', error);
      } finally {
        clearTimeout(timeout);
      }
    }

      console.info('[prototype event]', name, detail);
    }

    function renderQuestion() {
      const q = state.step === 2
        ? branchQuestions[state.answers[1]?.branch]
        : questions[state.step];
      $('stepText').textContent = `QUESTION ${state.step + 1}`;
      $('countText').textContent = `${state.step + 1} / ${questions.length}`;
      $('progressFill').style.width = `${(state.step / (questions.length - 1)) * 100}%`;

        button.addEventListener('click', () => chooseAnswer(option, index));
        return button;
      }));
    }

    function chooseAnswer(option, optionIndex) {
      state.answers[state.step] = option;
      track('answer_select', { question: state.step + 1, option: optionIndex + 1 });
      if (state.step < questions.length - 1) {
        state.step += 1;
        renderQuestion();
      } else {
        renderResult();
      }
    }

    function overlap(a = [], b = []) {
      return a.filter(value => b.includes(value)).length;
    }

    function scoreSong(song) {
      const selected = state.answers;
      let score = 0;
      score += overlap(song.emotion, selected[0]?.emotion) * 4;
      score += overlap(song.relation, selected[1]?.relation) * 4;
      score += overlap(song.situation, selected[2]?.situation) * 3;
      score += overlap(song.role, selected[3]?.role) * 5;
      score += overlap(song.sound, selected[4]?.sound) * 2;
      score += Math.max(0, 3 - Math.abs(song.energy - (selected[4]?.energy ?? 3)));
      score += Math.max(0, 2 - Math.abs(song.direction - (selected[0]?.direction ?? 0)));
      return score + Math.random() * .08;
    }

    function activeExclusionConditions() {
      const conditions = new Set();
      state.answers.forEach(answer => {
        (answer?.exclusionContext || []).forEach(condition => conditions.add(condition));
      });

      const isHappySky = state.answers[0]?.emotion?.includes('행복');
      const wantsToKeepFeeling = state.answers[3]?.role?.includes('유지');
      if (isHappySky && wantsToKeepFeeling) conditions.add('행복 유지');

      return conditions;
    }

    function isExcluded(song, activeConditions) {
      return (song.exclude || []).some(condition => activeConditions.has(condition));
    }

    function matchesSelectedSound(song) {
      const selectedSound = state.answers[4]?.sound || [];
      return selectedSound.length === 0 || overlap(song.sound, selectedSound) > 0;

    function resultReason(song) {
      const role = state.answers[3]?.role?.[0];
      const lines = {

        '안정': '복잡했던 호흡을 천천히 고르게 해줄 노래예요.',

        '유지': '지금의 좋은 마음을 오래 반짝이게 해줄 노래예요.'
      };
      return lines[role] || `${song.title}, 오늘의 마음과 가장 가까운 노래예요.`;
    }

    function renderResult() {

      const eligibleSongs = songs.filter(song => !isExcluded(song, activeConditions));
      const candidateSongs = eligibleSongs.length >= 3 ? eligibleSongs : songs;
      const ranked = candidateSongs
        .map(song => ({ ...song, score: scoreSong(song), soundMatch: matchesSelectedSound(song) }))
        .sort((a, b) => Number(b.soundMatch) - Number(a.soundMatch) || b.score - a.score);
      const winner = ranked[0];
      $('albumArt').src = artFor(winner);

      $('songTitle').textContent = `〈${winner.title}〉`;
      $('reason').textContent = resultReason(winner);
      $('story').textContent = winner.description || winner.desc || '';
      const videoId = winner.videoId || new URL(winner.youtube).searchParams.get('v');
      $('youtubePlayer').src = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&playsinline=1`;
      $('moreList').replaceChildren(...ranked.slice(1, 3).map((song, index) => {
        const link = document.createElement('a');
        link.className = 'more-card';
        link.href = song.youtube;
        link.target = '_blank';
        link.rel = 'noopener';
        link.innerHTML = `<img src="${artFor(song)}" alt="" loading="lazy" decoding="async" /><span><strong>${song.title}</strong><small>${song.album}</small></span><b aria-hidden="true">↗</b>`;
        link.addEventListener('click', () => track('youtube_click', { song: song.title, rank: index + 2 }));
        return link;
      }));
      $('albumWrap').style.setProperty('--accent', winner.direction > 0 ? '#74d0ff' : '#426fa8');
      showView('result');
      track('result_view', { songs: ranked.slice(0, 3).map(s => s.title) });
    }

    $('startButton').addEventListener('click', () => {
      state.step = 0;
      state.answers = [];
      renderQuestion();
      showView('quiz');
      track('quiz_start');
    });

    $('backButton').addEventListener('click', () => {
      if (state.step === 0) {
        state.answers = [];
        showView('intro');
        return;
      }

      state.answers = state.answers.slice(0, state.step);
      state.step -= 1;
      renderQuestion();
      track('answer_back', { question: state.step + 1 });
    });

    $('retryButton').addEventListener('click', () => {
      track('retry_click');
      state.step = 0;
      state.answers = [];
      renderQuestion();
      showView('quiz');
    });

    $('albumArt').addEventListener('error', () => {
      $('albumArt').alt = '';
      $('albumArt').style.background = 'linear-gradient(145deg, #8bd7ff, #0b2c59)';
    });
  </script>
</body>
</html>
